server:
  port: 8080

spring:
  application:
    name: pas-api
  # Local/dev database: in-memory H2 in PostgreSQL-compatibility mode, so the same
  # Flyway migrations run here and against Aurora PostgreSQL (architecture §2, §6).
  datasource:
    url: jdbc:h2:mem:pathwaymax;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    # Flyway owns the schema; Hibernate must never alter it.
    hibernate:
      ddl-auto: none
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
